services:
  voxtra:
    image: voxtra:cuda-latest
    ports:
      - "8080:8080"
    volumes:
      - voxtra_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

volumes:
  voxtra_data:
